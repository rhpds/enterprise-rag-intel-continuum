openapi: 3.1.0
info:
  title: Enterprise RAG Intel Continuum API
  description: >-
    Full RAG pipeline across the Intel inference continuum. Xeon handles
    embedding, vector search, and reranking while Gaudi handles generation.
    Supports document upload, chunking, embedding, similarity search,
    reranking, and answer generation with source attribution.
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Local development server

tags:
  - name: health
    description: Service health checks
  - name: rag
    description: RAG query and document management
  - name: stats
    description: Pipeline statistics

paths:
  /health:
    get:
      operationId: healthCheck
      summary: Health check
      description: Returns the current health status of the RAG service.
      tags:
        - health
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/v1/upload:
    post:
      operationId: uploadDocument
      summary: Upload a document for RAG indexing
      description: >-
        Upload a document (text or PDF) for chunking, embedding, and indexing
        into the in-memory vector store. Returns the document ID, chunk count,
        and number of embeddings generated.
      tags:
        - rag
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: The document file to upload (text or PDF).
          application/json:
            schema:
              $ref: "#/components/schemas/TextUploadRequest"
      responses:
        "200":
          description: Document uploaded and indexed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResponse"
        "400":
          description: Invalid file or content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/query:
    post:
      operationId: queryRAG
      summary: RAG query with full pipeline
      description: >-
        Execute a full RAG query: embed the query, search the vector store,
        rerank results, and generate an answer with source attribution.
        Each pipeline step reports hardware assignment and latency.
      tags:
        - rag
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryRequest"
      responses:
        "200":
          description: RAG query completed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryResponse"
        "400":
          description: Invalid query
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/documents:
    get:
      operationId: listDocuments
      summary: List indexed documents
      description: >-
        Return a list of all documents currently indexed in the vector store,
        including document ID, filename, chunk count, and indexing timestamp.
      tags:
        - rag
      responses:
        "200":
          description: List of indexed documents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentsResponse"

  /api/v1/stats:
    get:
      operationId: getStats
      summary: Pipeline statistics
      description: >-
        Return aggregate statistics for the RAG pipeline including total
        queries, documents indexed, average latency per step, and hardware
        utilization breakdown.
      tags:
        - stats
      responses:
        "200":
          description: Pipeline statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsResponse"

components:
  schemas:
    HealthResponse:
      type: object
      required:
        - status
        - service
      properties:
        status:
          type: string
          example: healthy
        service:
          type: string
          example: enterprise-rag-intel-continuum
        demo_mode:
          type: boolean
          example: true
        embedding_model:
          type: string
          example: nomic-embed-text
        generation_model:
          type: string
          example: qwen2.5:1.5b

    TextUploadRequest:
      type: object
      required:
        - content
        - filename
      properties:
        content:
          type: string
          description: The text content to index.
        filename:
          type: string
          description: A descriptive name for the document.
          example: intel-xeon-overview.txt

    UploadResponse:
      type: object
      required:
        - document_id
        - chunks
        - embeddings_generated
      properties:
        document_id:
          type: string
          description: Unique identifier for the indexed document.
          example: d3f1a2b4-5678-9abc-def0-123456789abc
        chunks:
          type: integer
          description: Number of text chunks created from the document.
          example: 12
        embeddings_generated:
          type: integer
          description: Number of embeddings generated and stored.
          example: 12

    QueryRequest:
      type: object
      required:
        - query
      properties:
        query:
          type: string
          description: The natural language query for RAG retrieval and generation.
          example: What are the benefits of Intel Xeon for AI inference?
        top_k:
          type: integer
          description: Number of top chunks to retrieve from the vector store.
          default: 5
          example: 5
        rerank:
          type: boolean
          description: Whether to apply reranking to retrieved chunks.
          default: true
          example: true

    QueryResponse:
      type: object
      required:
        - answer
        - sources
        - pipeline_steps
        - total_latency_ms
        - ai_disclaimer
      properties:
        answer:
          type: string
          description: The generated answer based on retrieved context.
          example: >-
            Intel Xeon processors provide optimized AI inference through
            AMX instructions and built-in accelerators.
        sources:
          type: array
          items:
            $ref: "#/components/schemas/SourceChunk"
          description: Retrieved source chunks with relevance scores.
        pipeline_steps:
          type: array
          items:
            $ref: "#/components/schemas/PipelineStep"
          description: Step-by-step pipeline execution details.
        total_latency_ms:
          type: number
          format: float
          description: Total end-to-end pipeline latency in milliseconds.
          example: 1234.5
        ai_disclaimer:
          type: string
          description: Disclaimer about AI-generated content.
          example: >-
            RAG answers are AI-generated from retrieved context --
            verify against source documents.

    SourceChunk:
      type: object
      required:
        - chunk
        - score
        - document
      properties:
        chunk:
          type: string
          description: The text content of the retrieved chunk.
        score:
          type: number
          format: float
          description: Relevance score for this chunk.
          example: 0.92
        document:
          type: string
          description: The source document filename.
          example: intel-xeon-overview.txt

    PipelineStep:
      type: object
      required:
        - step
        - hardware
        - latency_ms
      properties:
        step:
          type: string
          enum:
            - embed
            - search
            - rerank
            - generate
          description: The pipeline step name.
          example: embed
        hardware:
          type: string
          enum:
            - xeon
            - gaudi
          description: The Intel hardware that handled this step.
          example: xeon
        latency_ms:
          type: number
          format: float
          description: Latency for this step in milliseconds.
          example: 45.2

    DocumentsResponse:
      type: object
      required:
        - documents
        - count
      properties:
        documents:
          type: array
          items:
            $ref: "#/components/schemas/DocumentInfo"
        count:
          type: integer
          description: Total number of indexed documents.
          example: 5

    DocumentInfo:
      type: object
      required:
        - document_id
        - filename
        - chunks
      properties:
        document_id:
          type: string
          example: d3f1a2b4-5678-9abc-def0-123456789abc
        filename:
          type: string
          example: intel-xeon-overview.txt
        chunks:
          type: integer
          example: 12
        indexed_at:
          type: string
          format: date-time
          example: "2025-01-15T10:30:00Z"

    StatsResponse:
      type: object
      required:
        - total_queries
        - total_documents
        - total_chunks
        - average_latency_ms
        - hardware_utilization
        - demo_mode
        - uptime_seconds
      properties:
        total_queries:
          type: integer
          description: Total RAG queries processed.
          example: 42
        total_documents:
          type: integer
          description: Total documents indexed.
          example: 5
        total_chunks:
          type: integer
          description: Total chunks in the vector store.
          example: 87
        average_latency_ms:
          type: number
          format: float
          description: Average total pipeline latency.
          example: 1100.5
        hardware_utilization:
          type: object
          properties:
            xeon_steps:
              type: integer
              description: Number of pipeline steps handled by Xeon.
              example: 3
            gaudi_steps:
              type: integer
              description: Number of pipeline steps handled by Gaudi.
              example: 1
        demo_mode:
          type: boolean
          example: true
        uptime_seconds:
          type: number
          format: float
          example: 3600.5

    ErrorResponse:
      type: object
      required:
        - detail
      properties:
        detail:
          type: string
          description: Human-readable error message.
          example: Query cannot be empty.
