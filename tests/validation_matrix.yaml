# Validation Matrix — CDD → TDD → EDD
# Write tests RED, deploy until GREEN. Each stage gates the next.
# Adapt per quickstart: fill in technique-specific criteria in stage_2_unit.

stages:

  stage_0_contracts:
    description: "All API contracts defined and parseable"
    threshold: 100
    criteria:
      openapi_spec_valid:
        description: "OpenAPI spec validates against 3.1"
        points: 25
        required: true
      openapi_has_paths:
        description: "Spec defines at least one path with operations"
        points: 25
        required: true
      openapi_refs_resolve:
        description: "All $ref pointers resolve within the spec"
        points: 25
        required: true
      openapi_responses_defined:
        description: "Every operation has at least one response schema"
        points: 25
        required: true

  stage_1_infrastructure:
    description: "Containers build, services start, health checks pass"
    threshold: 90
    criteria:
      container_builds:
        description: "Containerfile builds successfully"
        points: 20
        required: true
      compose_stack_starts:
        description: "docker-compose stack starts with all health checks passing"
        points: 20
        required: true
      model_endpoint_responds:
        description: "Model serving endpoint returns expected model name"
        points: 20
        required: true
      no_hardcoded_secrets:
        description: "No API keys, passwords, or secrets in source code"
        points: 20
        required: true
      helm_template_renders:
        description: "Helm chart renders cleanly with default values"
        points: 20
        required: true

  stage_2_unit:
    description: "RAG pipeline technique works in isolation"
    threshold: 90
    criteria:
      document_chunking:
        description: "Text splits into overlapping chunks with configurable size"
        points: 12
        required: true
      embedding_generation:
        description: "Chunks get deterministic embeddings of correct dimension"
        points: 12
        required: true
      vector_search:
        description: "Cosine similarity search returns top_k results"
        points: 12
        required: true
      reranking:
        description: "Reranking reorders chunks by query relevance"
        points: 12
        required: true
      full_pipeline:
        description: "Query -> embed -> search -> rerank -> generate produces answer"
        points: 12
        required: true
      hardware_assignment:
        description: "Each pipeline step reports correct hardware (xeon/gaudi)"
        points: 12
        required: true
      demo_mode_preloaded:
        description: "Demo mode pre-loads sample documents for immediate use"
        points: 10
        required: true
      upload_and_query:
        description: "Uploaded documents become searchable via query API"
        points: 10
        required: true
      ai_disclaimer:
        description: "All responses include AI-generated content disclaimer"
        points: 8
        required: true

  stage_3_integration:
    description: "End-to-end flow works from UI to model and back"
    threshold: 85
    criteria:
      full_user_flow:
        description: "UI → backend → model → response → UI completes"
        points: 25
        required: true
      response_has_real_metrics:
        description: "Response contains real model name and measured latency"
        points: 15
        required: true
      no_hardcoded_latency:
        description: "No hardcoded ms/s values displayed as live measurements"
        points: 15
        required: true
      ai_transparency_labels:
        description: "AI-generated content labeled with persistent disclaimers"
        points: 10
        required: true
      health_endpoint:
        description: "Health endpoint returns service status + model connectivity"
        points: 10
        required: true
      error_handling:
        description: "Model timeout produces user-friendly message"
        points: 10
        required: true
      compose_15_min:
        description: "docker compose up → working demo in ≤ 15 minutes"
        points: 15
        required: true

  stage_4_benchmarks:
    description: "RAG pipeline performance meets thresholds"
    threshold: 80
    criteria:
      pipeline_latency:
        description: "Full pipeline query completes within 10 seconds (demo mode)"
        points: 30
        required: true
      embedding_latency:
        description: "Embedding step completes within 2 seconds"
        points: 20
        required: true
      search_latency:
        description: "Vector search step completes within 500 ms"
        points: 25
        required: true
      chunk_count_accuracy:
        description: "Document upload reports correct chunk count"
        points: 25
        required: true

  stage_5_publication:
    description: "README passes automated review with zero BLOCKERs"
    threshold: 100
    criteria:
      title_format:
        description: "H1 title ≤ 64 chars, starts with action verb"
        points: 10
        required: true
      short_description:
        description: "Short description ≤ 160 chars"
        points: 10
        required: true
      required_sections:
        description: "All required README sections present in correct order"
        points: 15
        required: true
      architecture_diagram:
        description: "Architecture diagram in docs/images/ with alt text"
        points: 10
        required: true
      no_credentials:
        description: "No hardcoded credentials in repo"
        points: 15
        required: true
      links_resolve:
        description: "All links (internal + external) resolve"
        points: 10
        required: true
      industry_tag:
        description: "Industry tag from approved list"
        points: 10
        required: true
      tag_format:
        description: "Tags as bulleted list with bold key and normal value"
        points: 5
        required: true
      opl_compliance:
        description: "Red Hat trademark first-mention-only rule"
        points: 10
        required: true
      accessibility:
        description: "WCAG 2.2 AA: heading nesting, alt text, descriptive links"
        points: 5
        required: true
