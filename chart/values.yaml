---
# OpenAI-compatible MaaS configuration. RHDP supplies these values through
# quickstart_deploy_via_make and a per-user LiteLLM virtual key.
model:
  name: qwen3-14b
  endpoint: ""
  api_key: ""
  api_type: openai
  hardware: maas

# Application configuration
app:
  replicas: 1
  image: quay.io/redhat-gpte/enterprise-rag-intel-continuum:latest
  imagePullPolicy: Always

ui:
  replicas: 1

route:
  enabled: true

# RAG pipeline configuration
rag:
  embedding_model: nomic-embed-text
  chunk_size: 512
  chunk_overlap: 50
  demo_mode: true

# Ollama is used by docker-compose for laptop development, not by this chart.
ollama:
  enabled: false
  image: ollama/ollama:latest
  models:
    - nomic-embed-text
    - qwen2.5:1.5b
