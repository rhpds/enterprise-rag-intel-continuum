apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-model
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  api-key: {{ required "model.api_key is required for MaaS deployment" .Values.model.api_key | quote }}
