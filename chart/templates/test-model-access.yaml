apiVersion: v1
kind: Pod
metadata:
  name: "{{ .Release.Name }}-test-model-access"
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  containers:
    - name: test
      image: registry.access.redhat.com/ubi9/ubi-minimal:latest
      command: ["sh", "-c"]
      args:
        - |
          {{- if .Values.model.endpoint }}
          ENDPOINT={{ .Values.model.endpoint | quote }}
          MODELS_URL="${ENDPOINT%/}"
          case "$MODELS_URL" in */v1) ;; *) MODELS_URL="$MODELS_URL/v1" ;; esac
          curl -sf "$MODELS_URL/models" \
            -H "Authorization: Bearer $MODEL_API_KEY" \
            && echo "Model access: OK" || exit 1
          {{- else }}
          echo "No external model configured — skipping connectivity test"
          {{- end }}
      env:
        - name: MODEL_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-model
              key: api-key
  restartPolicy: Never
