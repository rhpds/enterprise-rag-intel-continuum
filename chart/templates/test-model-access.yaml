apiVersion: v1
kind: Pod
metadata:
  name: "{{ .Release.Name }}-test-model-access"
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  containers:
    - name: test
      image: registry.access.redhat.com/ubi9/ubi-minimal:latest
      command: ["sh", "-c"]
      args:
        - |
          {{- if .Values.model.endpoint }}
          ENDPOINT={{ .Values.model.endpoint | quote }}
          MODELS_URL="${ENDPOINT%/}"
          case "$MODELS_URL" in */v1) ;; *) MODELS_URL="$MODELS_URL/v1" ;; esac
          curl -sf "$MODELS_URL/models" \
            -H "Authorization: Bearer $MODEL_API_KEY" \
            >/dev/null || exit 1
          CHAT_URL="${MODELS_URL%/models}/chat/completions"
          curl -sf "$CHAT_URL" \
            -H "Authorization: Bearer $MODEL_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"model\":\"$MODEL_NAME\",\"messages\":[{\"role\":\"user\",\"content\":\"Reply with OK\"}],\"max_tokens\":8,\"temperature\":0}" \
            >/dev/null || exit 1
          echo "MaaS model access and generation: OK"
          {{- else }}
          echo "No external model configured — skipping connectivity test"
          {{- end }}
      env:
        - name: MODEL_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-model
              key: api-key
        - name: MODEL_NAME
          value: {{ .Values.model.name | quote }}
  restartPolicy: Never
