apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.app.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: api
          image: {{ .Values.app.image | quote }}
          imagePullPolicy: {{ .Values.app.imagePullPolicy }}
          command: ["uvicorn", "rag:app", "--host", "0.0.0.0", "--port", "8080"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: GENERATION_ENDPOINT
              value: {{ required "model.endpoint is required for MaaS deployment" .Values.model.endpoint | quote }}
            - name: GENERATION_MODEL
              value: {{ .Values.model.name | quote }}
            - name: GENERATION_API_TYPE
              value: {{ .Values.model.api_type | quote }}
            - name: GENERATION_HARDWARE
              value: {{ .Values.model.hardware | quote }}
            - name: GENERATION_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-model
                  key: api-key
            - name: DEMO_MODE
              value: {{ .Values.rag.demo_mode | quote }}
            - name: EMBEDDING_MODEL
              value: {{ .Values.rag.embedding_model | quote }}
            - name: CHUNK_SIZE
              value: {{ .Values.rag.chunk_size | quote }}
            - name: CHUNK_OVERLAP
              value: {{ .Values.rag.chunk_overlap | quote }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-ui
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: ui
spec:
  replicas: {{ .Values.ui.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: ui
    spec:
      containers:
        - name: ui
          image: {{ .Values.app.image | quote }}
          imagePullPolicy: {{ .Values.app.imagePullPolicy }}
          command: ["python", "ui.py"]
          ports:
            - name: http
              containerPort: 7860
          env:
            - name: APP_URL
              value: http://{{ .Release.Name }}-api:8080
          readinessProbe:
            tcpSocket:
              port: http
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
